{% extends 'listings/base.html' %}

{% block content %}



<h1>Articles</h1>

<a href="{% url 'listings-create' %}">Créer un nouveau listing</a>
<ul>
   {% for listing in listings %}
      <li>
        <a href="{% url 'listings-detail' listing.id %}">{{ listing.title }}</a>
        - <a href="{% url 'listings-change' listing.id %}">[modifier]</a>
        - <a href="{% url 'listings-delete' listing.id %}">[supprimer]</a>
      </li>
   {% endfor %}
</ul>

{% endblock %}
